stages:
  train:
    cmd: >-
      python -m training.train
      --data-path data/raw/breast_cancer.csv
      --output-dir artifacts
      --model-version 1.0.0
      --metrics-path metrics.json
    deps:
      - data/raw/breast_cancer.csv
      - training/train.py
    params:
      - seed
      - data.test_size
      - cv.folds
      - selection.min_test_malignant_recall
      - models
    outs:
      - artifacts/model.joblib:
          push: false
      - artifacts/model_card.json:
          push: false
    metrics:
      - metrics.json:
          cache: false
